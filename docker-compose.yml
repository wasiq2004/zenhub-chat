version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_HOST: backend
        BACKEND_PORT: 3011

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - forgecrm

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - backend_uploads:/app/uploads
      - backend_media:/app/media

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - forgecrm

  postgres:
    image: postgres:16-alpine

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - forgecrm

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - forgecrm

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_media:

networks:
  forgecrm:
    driver: bridge
