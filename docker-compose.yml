services:
  # The frontend (nginx) is the single web entrypoint: it serves the SPA and
  # proxies /api, /uploads, /l/ and the SSE stream to the backend. The host's
  # existing reverse proxy terminates TLS for the domain and forwards to the
  # published port below. No Caddy container — it added a redundant hop and was
  # the only thing fighting for host port 80.
  #
  # ── DOMAIN MAPPING ──────────────────────────────────────────────────────
  # Point zenhubchat.axxeler.in (in your host's nginx/Caddy) at:
  #     container: forgecrm-frontend   host port: 2001  (FRONTEND_PORT)
  # i.e. proxy_pass http://127.0.0.1:2001;  — change FRONTEND_PORT if 2001 is taken.
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_HOST: forgecrm-backend
        BACKEND_PORT: 3011
    container_name: forgecrm-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-2001}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - forgecrm

  backend:
    build:
      context: ./backend
    container_name: forgecrm-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_media:/app/media
      # Ship the SQL migrations to where the boot-time runner looks
      # (src/db/migrate.js resolves __dirname/../../db/migrations = /app/db/migrations).
      # Without this the runner logs "migrations directory not found" and skips.
      - ./db/migrations:/app/db/migrations:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - forgecrm

  postgres:
    image: postgres:16-alpine
    container_name: forgecrm-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - forgecrm

  redis:
    image: redis:7-alpine
    container_name: forgecrm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - forgecrm

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_media:

networks:
  forgecrm:
    driver: bridge
